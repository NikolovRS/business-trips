<!DOCTYPE html><html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Командировки и Разходи</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-4 sm:p-6"><!-- LOGIN SCREEN -->
<div id="loginScreen" class="max-w-md mx-auto bg-white shadow-lg rounded-2xl p-6 mt-10">
    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-indigo-600 mb-2">🚗 Командировки и Разходи</h1>
        <p class="text-gray-500">Въведете общата парола за достъп</p>
    </div>

    <form id="loginForm">
        <label class="block text-sm font-bold mb-1">Парола</label>
        <input
            type="password"
            id="loginPassword"
            inputmode="numeric"
            autocomplete="current-password"
            maxlength="6"
            class="w-full border rounded-lg p-3 bg-white text-center text-xl tracking-widest"
            placeholder="••••••"
            required
        >

        <button
            type="submit"
            id="loginBtn"
            class="w-full mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-lg transition"
        >
            Вход
        </button>

        <div id="loginError" class="hidden mt-4 text-center text-red-600 text-sm font-medium">
            Грешна парола.
        </div>
    </form>
</div>

<!-- MAIN APPLICATION -->
<div id="appScreen" class="max-w-4xl mx-auto bg-white shadow-lg rounded-2xl p-6">

    <header class="mb-6 border-b pb-4">
        <div class="flex justify-between items-center gap-3">
            <h1 class="text-2xl font-bold text-indigo-600 mb-4">🚗 Командировки и Разходи</h1>

            <button
                id="logoutBtn"
                class="text-xs text-gray-500 hover:text-red-600 border rounded-lg px-3 py-2"
            >
                Изход
            </button>
        </div>

        <div id="summaryContainer"></div>
    </header>

    <!-- ФОРМА ЗА ВЪВЕЖДАНЕ -->
    <form id="expenseForm" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-6 bg-gray-50 p-4 rounded-xl border">

        <div>
            <label class="block text-sm font-bold mb-1">Име на шофьор</label>
            <select id="driverName" class="w-full border rounded-lg p-2 bg-white" required>
                <option value="">Изберете шофьор</option>
                <option value="Иво">Иво</option>
                <option value="Краси">Краси</option>
                <option value="Румен">Румен</option>
                <option value="Иван">Иван</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-bold mb-1">Дата</label>
            <input type="date" id="expenseDate" class="w-full border rounded-lg p-2 bg-white" required>
        </div>

        <div>
            <label class="block text-sm font-bold mb-1">Дестинация / Град</label>
            <input type="text" id="destination" placeholder="напр. Варна" class="w-full border rounded-lg p-2 bg-white" required>
        </div>

        <div>
            <label class="block text-sm font-bold mb-1">Наименование на разхода</label>
            <input type="text" id="expenseName" placeholder="напр. Хотел, Вечеря, Гориво..." class="w-full border rounded-lg p-2 bg-white">
        </div>

        <div>
            <label class="block text-sm font-bold mb-1">Сума (€)</label>
            <input type="number" step="0.01" id="amount" placeholder="0.00" class="w-full border rounded-lg p-2 bg-white">
        </div>

        <div class="sm:col-span-2 lg:col-span-3 flex justify-end">
            <button
                type="submit"
                id="submitBtn"
                class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-2 rounded-lg transition"
            >
                Добави запис
            </button>
        </div>
    </form>

    <!-- ФИЛТРИ -->
    <div class="flex flex-col sm:flex-row justify-between items-center mb-4 gap-2">
        <div class="w-full sm:w-auto flex flex-wrap gap-2">

            <select id="filterDriver" class="border rounded-lg p-2 text-sm bg-white">
                <option value="">Всички шофьори</option>
                <option value="Иво">Иво</option>
                <option value="Краси">Краси</option>
                <option value="Румен">Румен</option>
                <option value="Иван">Иван</option>
            </select>

            <input type="month" id="filterMonth" class="border rounded-lg p-2 text-sm bg-white">

        </div>
    </div>

    <!-- ТАБЛИЦА -->
    <div class="overflow-x-auto border rounded-xl relative min-h-[150px]">

        <div
            id="loadingOverlay"
            class="absolute inset-0 bg-white/80 flex items-center justify-center font-medium text-indigo-600"
        >
            Свързване с Firebase...
        </div>

        <table class="w-full text-left border-collapse">

            <thead>
                <tr class="bg-gray-100 border-b text-sm text-gray-600">
                    <th class="p-3">Дата</th>
                    <th class="p-3">Шофьор</th>
                    <th class="p-3">Дестинация</th>
                    <th class="p-3">Наименование</th>
                    <th class="p-3 text-right">Сума</th>
                    <th id="actionHeader" class="p-3 text-center hidden">Действие</th>
                </tr>
            </thead>

            <tbody id="expenseTableBody" class="divide-y text-sm"></tbody>

        </table>
    </div>
</div>

<!-- FIREBASE -->
<script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    import {
        getDatabase,
        ref,
        push,
        onValue,
        set
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    import {
        getAuth,
        signInWithEmailAndPassword,
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


    const firebaseConfig = {
        apiKey: "AIzaSyDUtXr67pU53x0B0ZVyky1q9Nysx0UAKoo",
        authDomain: "business-trips-b195c.firebaseapp.com",
        databaseURL: "https://business-trips-b195c-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "business-trips-b195c",
        storageBucket: "business-trips-b195c.firebasestorage.app",
        messagingSenderId: "430743635179",
        appId: "1:430743635179:web:c0d3790c88e646b6b9eaae"
    };


    /*
     * ТУК НЕ СЕ СЪХРАНЯВА ПАРОЛАТА.
     *
     * Използва се email адресът, с който създадохме
     * общия Firebase Authentication акаунт.
     *
     * ВАЖНО:
     * Замени текста по-долу с email адреса,
     * който използва при създаването на Firebase акаунта.
     */
    const AUTH_EMAIL = "nikolov.rum@gmail.com";


    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    const expensesRef = ref(db, "expenses");


    const loginScreen = document.getElementById("loginScreen");
    const appScreen = document.getElementById("appScreen");

    const loginForm = document.getElementById("loginForm");
    const loginPassword = document.getElementById("loginPassword");
    const loginBtn = document.getElementById("loginBtn");
    const loginError = document.getElementById("loginError");

    const logoutBtn = document.getElementById("logoutBtn");

    const form = document.getElementById("expenseForm");
    const tableBody = document.getElementById("expenseTableBody");

    const filterDriver = document.getElementById("filterDriver");
    const filterMonth = document.getElementById("filterMonth");

    const loadingOverlay = document.getElementById("loadingOverlay");
    const submitBtn = document.getElementById("submitBtn");
    const summaryContainer = document.getElementById("summaryContainer");

    const actionHeader = document.getElementById("actionHeader");


    let expenses = [];
    let databaseListenerStarted = false;


    /*
     * Firebase автоматично възстановява сесията,
     * ако потребителят вече е влизал.
     */
     onAuthStateChanged(auth, async (user) => {

    // Данните се зареждат винаги — и без вход
    if (!databaseListenerStarted) {
        startDatabaseListener();
    }

    // Ако е правилният акаунт — разрешаваме редакция
    if (user && user.uid === "oqhVjnT4EEZ9szD6mNgGo7c1BnF2") {

        loginScreen.classList.add("hidden");

        form.classList.remove("hidden");

        logoutBtn.classList.remove("hidden");

        renderTable();

    } else {

        // Ако има друга/стара Firebase сесия — изчистваме я
        if (user) {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Грешка при изчистване на старата сесия:", error);
            }
        }

        loginScreen.classList.remove("hidden");

        form.classList.add("hidden");

        logoutBtn.classList.add("hidden");

        renderTable();
    }
});


    /*
     * ВХОД
     */
    loginForm.addEventListener("submit", async (e) => {

        e.preventDefault();

        const password = loginPassword.value.trim();

        if (!password) {
            return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = "Проверка...";
        loginError.classList.add("hidden");

        try {

            await signInWithEmailAndPassword(
                auth,
                AUTH_EMAIL,
                password
            );

            loginPassword.value = "";

        } catch (error) {

            console.error("Грешка при вход:", error);

            loginError.textContent = "Грешна парола.";
            loginError.classList.remove("hidden");

            loginPassword.value = "";
            loginPassword.focus();

        } finally {

            loginBtn.disabled = false;
            loginBtn.textContent = "Вход";

        }
    });


    /*
     * ИЗХОД
     */
    logoutBtn.addEventListener("click", async () => {

        try {
            await signOut(auth);
        } catch (error) {
            console.error("Грешка при изход:", error);
        }

    });


    /*
     * ДАННИ ОТ FIREBASE
     */
    function startDatabaseListener() {

        databaseListenerStarted = true;

        onValue(
            expensesRef,
            (snapshot) => {

                expenses = [];

                const data = snapshot.val();

                if (data) {

                    Object.keys(data).forEach((key) => {

                        if (!data[key].deleted) {

                            expenses.push({
                                id: key,
                                ...data[key]
                            });

                        }

                    });

                }

                loadingOverlay.classList.add("hidden");

                renderTable();

            },
            (error) => {

                console.error("Грешка при четене:", error);

                loadingOverlay.textContent =
                    "Грешка при зареждане на данните.";

            }
        );
    }


    /*
     * ДНЕШНА ДАТА
     */
    document.getElementById("expenseDate").valueAsDate = new Date();


    /*
     * ТЕКУЩ МЕСЕЦ
     */
    const now = new Date();

    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");

    document.getElementById("filterMonth").value =
        `${year}-${month}`;


    function formatMonthName(ymString) {

        if (!ymString) return "";

        const [y, m] = ymString.split("-");

        const months = [
            "Януари",
            "Февруари",
            "Март",
            "Април",
            "Май",
            "Юни",
            "Юли",
            "Август",
            "Септември",
            "Октомври",
            "Ноември",
            "Декември"
        ];

        const monthName =
            months[parseInt(m, 10) - 1] || m;

        return `${monthName} ${y}`;
    }


    function formatDate(dateStr) {

        if (!dateStr) return "";

        const parts = String(dateStr).split("-");

        if (parts.length === 3) {

            return `${parts[2]}.${parts[1]}.${parts[0]}`;

        }

        return dateStr;
    }


    /*
     * ДОБАВЯНЕ НА ЗАПИС
     */
    form.addEventListener("submit", async (e) => {

        e.preventDefault();

        const user = auth.currentUser;

        if (!user) {

            alert("Сесията е изтекла. Моля, влезте отново.");

            return;
        }


        const rawAmount =
            parseFloat(
                document.getElementById("amount").value
            );

        const rawName =
            document.getElementById("expenseName")
                .value
                .trim();


        const newExpense = {

            date:
                document.getElementById("expenseDate").value,

            driver:
                document.getElementById("driverName").value,

            destination:
                document.getElementById("destination").value,

            expenseName:
                rawName !== "" ? rawName : "-",

            amount:
                !isNaN(rawAmount) ? rawAmount : 0,

            createdAt:
                Date.now()
        };


        submitBtn.disabled = true;
        submitBtn.textContent = "Записване...";


        try {

            await push(
                expensesRef,
                newExpense
            );

            form.reset();

            document.getElementById(
                "expenseDate"
            ).valueAsDate = new Date();

        } catch (error) {

            console.error(error);

            alert(
                "Грешка при запис: " +
                error.message
            );

        } finally {

            submitBtn.disabled = false;
            submitBtn.textContent = "Добави запис";

        }

    });


    /*
     * ИЗТРИВАНЕ
     */
    tableBody.addEventListener("click", async (e) => {

        if (
            e.target &&
            e.target.classList.contains("delete-btn")
        ) {

            const idToDelete =
                e.target.getAttribute("data-id");


            if (!auth.currentUser) {

                alert(
                    "Сесията е изтекла. Моля, влезте отново."
                );

                return;
            }


            if (
                confirm(
                    "Сигурни ли сте, че искате да изтриете този запис?"
                )
            ) {

                try {

                    await set(
                        ref(
                            db,
                            "expenses/" + idToDelete
                        ),
                        {
                            deleted: true,
                            deletedAt: Date.now()
                        }
                    );

                } catch (error) {

                    console.error(error);

                    alert(
                        "Грешка при изтриване: " +
                        error.message
                    );

                }

            }

        }

    });


    filterDriver.addEventListener(
        "change",
        renderTable
    );

    filterMonth.addEventListener(
        "change",
        renderTable
    );


    function renderTable() {

        tableBody.innerHTML = "";

        const selectedDriver =
            filterDriver.value;

        const selectedMonth =
            filterMonth.value;

        const formattedMonth =
            formatMonthName(selectedMonth);


        let driverMonthlyTotals = {

            "Иво": 0,
            "Краси": 0,
            "Румен": 0,
            "Иван": 0

        };


        expenses.forEach((item) => {

            if (!item.date) return;

            const matchMonth =
                selectedMonth
                    ? item.date.startsWith(selectedMonth)
                    : true;


            if (
                matchMonth &&
                driverMonthlyTotals[item.driver] !== undefined
            ) {

                driverMonthlyTotals[item.driver] +=
                    Number(item.amount) || 0;

            }

        });


        if (selectedDriver) {

            const totalForDriver =
                driverMonthlyTotals[selectedDriver] || 0;


            summaryContainer.innerHTML = `

                <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100 flex flex-col sm:flex-row justify-between items-center gap-2">

                    <div>

                        <div class="text-xs text-indigo-500 font-medium uppercase tracking-wide">
                            Месечни разходи за шофьор
                        </div>

                        <div class="text-xl font-bold text-indigo-700">
                            ${selectedDriver} &bull; ${formattedMonth}
                        </div>

                    </div>

                    <div class="text-2xl font-extrabold text-indigo-800">
                        ${totalForDriver.toFixed(2)} €
                    </div>

                </div>

            `;

        } else {

            summaryContainer.innerHTML = `

                <div class="text-xs text-gray-500 font-medium mb-2">
                    Общо разходи за ${formattedMonth} по шофьори:
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">

                    <div class="bg-indigo-50 p-3 rounded-xl border border-indigo-100">
                        <div class="text-xs text-indigo-500 font-medium">Иво</div>
                        <div class="text-lg font-bold text-indigo-700">
                            ${driverMonthlyTotals["Иво"].toFixed(2)} €
                        </div>
                    </div>

                    <div class="bg-indigo-50 p-3 rounded-xl border border-indigo-100">
                        <div class="text-xs text-indigo-500 font-medium">Краси</div>
                        <div class="text-lg font-bold text-indigo-700">
                            ${driverMonthlyTotals["Краси"].toFixed(2)} €
                        </div>
                    </div>

                    <div class="bg-indigo-50 p-3 rounded-xl border border-indigo-100">
                        <div class="text-xs text-indigo-500 font-medium">Румен</div>
                        <div class="text-lg font-bold text-indigo-700">
                            ${driverMonthlyTotals["Румен"].toFixed(2)} €
                        </div>
                    </div>

                    <div class="bg-indigo-50 p-3 rounded-xl border border-indigo-100">
                        <div class="text-xs text-indigo-500 font-medium">Иван</div>
                        <div class="text-lg font-bold text-indigo-700">
                            ${driverMonthlyTotals["Иван"].toFixed(2)} €
                        </div>
                    </div>

                </div>

            `;
        }


        let filtered =
            expenses.filter((item) => {

                if (!item.date) return false;

                const matchDriver =
                    selectedDriver
                        ? item.driver === selectedDriver
                        : true;

                const matchMonth =
                    selectedMonth
                        ? item.date.startsWith(selectedMonth)
                        : true;

                return matchDriver && matchMonth;

            });


        filtered.sort(
            (a, b) =>
                new Date(b.date) -
                new Date(a.date)
        );


        if (filtered.length === 0) {

            tableBody.innerHTML = `

                <tr>

                    <td
                        colspan="6"
                        class="p-4 text-center text-gray-500"
                    >
                        Няма въведени записи за този период.
                    </td>

                </tr>

            `;

            return;
        }


        filtered.forEach((item) => {

            const itemAmount =
                Number(item.amount) || 0;


            const isVacation =
                item.destination &&
                item.destination
                    .trim()
                    .toLowerCase() === "почивка";


            const cellStyle =
                isVacation

                    ? 'style="color: #16a34a; font-weight: bold;"'

                    : 'style="color: #b91c1c; font-weight: bold;"';


            const row =
                document.createElement("tr");


            row.className =
                "hover:bg-gray-50";


            row.innerHTML = `

                <td class="p-3">
                    ${formatDate(item.date)}
                </td>

                <td class="p-3 font-medium">
                    ${item.driver}
                </td>

                <td class="p-3" ${cellStyle}>
                    ${item.destination}
                </td>

                <td class="p-3">
                    ${item.expenseName || "-"}
                </td>

                <td class="p-3 text-center">

    ${
        auth.currentUser &&
        auth.currentUser.uid === "oqhVjnT4EEZ9szD6mNgGo7c1BnF2"

        ? `
            <button
                data-id="${item.id}"
                class="delete-btn text-red-500 hover:text-red-700 font-semibold px-2 py-1 rounded text-xs border border-red-200 hover:border-red-400 bg-red-50 transition"
            >
                Изтрий
            </button>
        `

        : `
            <span class="text-xs text-gray-400">Само преглед</span>
        `
    }

</td>

            `;

            tableBody.appendChild(row);

        });

    }

</script>

</body>
</html>
